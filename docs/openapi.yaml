openapi: 3.0.3
info:
  title: Finance Tracker Offline-First API
  version: 1.0.0
  description: |
    API Contract for Finance Tracker backend (FastAPI).
    Supports offline-first operations, outbox batch pushing, idempotent sync, and optimistic concurrency control (OCC).
servers:
  - url: http://localhost:8000/api/v1
    description: Local Docker host (Web / Windows client)
  - url: http://10.0.2.2:8000/api/v1
    description: Android Emulator to Docker host
  - url: https://api.financetracker.local/api/v1
    description: Staging / Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Invalid credentials or expired token."
        details:
          type: object
          additionalProperties: true

    User:
      type: object
      required:
        - id
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifespan in seconds (e.g. 1800 for 30m)
          example: 1800

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    TransactionType:
      type: string
      enum: [income, expense]

    TransactionRecord:
      type: object
      required:
        - id
        - user_id
        - amount
        - type
        - category
        - date
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv4
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Transaction amount in IDR (integer without decimals)
          example: 45000
        type:
          $ref: '#/components/schemas/TransactionType'
        category:
          type: string
          example: "Makanan"
        note:
          type: string
          nullable: true
          example: "Makan siang warteg"
        date:
          type: string
          format: date
          example: "2026-11-15"
          description: Local calendar date of the transaction (YYYY-MM-DD)
        version:
          type: integer
          description: Incremental version maintained by the server
          example: 1
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Null for active records, timestamp if tombstoned
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OutboxAction:
      type: string
      enum: [create, update, delete]

    PushItem:
      type: object
      required:
        - id
        - action
        - base_version
        - client_updated_at
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/OutboxAction'
        base_version:
          type: integer
          description: Version from client when this edit/delete was started. 0 for new creates.
          example: 1
        amount:
          type: integer
          format: int64
          description: Required if action is create or update
          example: 50000
        type:
          $ref: '#/components/schemas/TransactionType'
        category:
          type: string
          example: "Transportasi"
        note:
          type: string
          nullable: true
        date:
          type: string
          format: date
          example: "2026-11-15"
        client_updated_at:
          type: string
          format: date-time

    PushBatchRequest:
      type: object
      required:
        - batch_id
        - items
      properties:
        batch_id:
          type: string
          format: uuid
          description: Unique UUID for idempotency. Sending same batch_id twice returns cached result.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PushItem'

    PushAppliedItem:
      type: object
      required:
        - id
        - version
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          description: New version assigned by the server
          example: 2
        updated_at:
          type: string
          format: date-time

    PushConflictItem:
      type: object
      required:
        - id
        - conflict_reason
        - server_record
      properties:
        id:
          type: string
          format: uuid
        conflict_reason:
          type: string
          enum: [version_mismatch, already_deleted, not_found]
        server_record:
          $ref: '#/components/schemas/TransactionRecord'

    PushBatchResponse:
      type: object
      required:
        - batch_id
        - applied
        - conflicts
      properties:
        batch_id:
          type: string
          format: uuid
        applied:
          type: array
          items:
            $ref: '#/components/schemas/PushAppliedItem'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/PushConflictItem'

    PullResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          description: All items updated since cursor, including tombstones (deleted_at != null)
          items:
            $ref: '#/components/schemas/TransactionRecord'
        next_cursor:
          type: string
          nullable: true
          description: Timestamp ISO string or sequence token to pass in the next pull request
          example: "2026-11-15T04:12:00Z"
        has_more:
          type: boolean
          example: false

    ResolveConflictRequest:
      type: object
      required:
        - id
        - resolution
        - target_version
      properties:
        id:
          type: string
          format: uuid
        resolution:
          type: string
          enum: [use_client, use_server]
          description: "'use_client' will overwrite server record; 'use_server' will discard client changes."
        target_version:
          type: integer
          description: Current server version that the client is acknowledging and bumping
        client_data:
          type: object
          description: Required if resolution is 'use_client'
          properties:
            amount:
              type: integer
              format: int64
            type:
              $ref: '#/components/schemas/TransactionType'
            category:
              type: string
            note:
              type: string
              nullable: true
            date:
              type: string
              format: date

paths:
  /auth/register:
    post:
      summary: Register new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Email already in use or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login with email & password to obtain JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Rotate and refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access and refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid or revoked

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /sync/push:
    post:
      summary: Push batch of client mutations (idempotent via batch_id)
      description: |
        Processes creates, updates, and deletes from the client outbox.
        Uses optimistic concurrency check (base_version vs current server version).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBatchRequest'
      responses:
        '200':
          description: Batch processed. Lists applied items and conflicted items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushBatchResponse'
        '401':
          description: Unauthorized

  /sync/pull:
    get:
      summary: Pull remote changes since cursor
      description: |
        Returns updated/deleted transaction records since the provided cursor.
        Deleted items have deleted_at populated (tombstone).
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: ISO timestamp or token from previous pull (omit for initial sync)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Remote changes list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '401':
          description: Unauthorized

  /sync/resolve-conflict:
    post:
      summary: Explicitly resolve a conflicting transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRecord'
        '400':
          description: Invalid conflict resolution payload
        '401':
          description: Unauthorized
